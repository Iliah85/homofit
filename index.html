/* Mikhak (c) Amin Abedi, SIL Open Font License 1.1, https://github.com/aminabedi68/Mikhak */
/* HomoFit — same family as HomoPlanner (paper on a desk, grid notebook), red instead of blue */
:root{
  --desk:#e8dfcf; --paper:#fbf7ee; --card:#fffdf8; --card-2:#f6efe2;
  --ink:#24252b; --ink-2:#4f4e49; --ink-3:#6e6a60;
  --rule:rgba(195,48,42,.07); --line:#e3d8c4; --line-2:#c9bca3;
  --acc:#c3302a; --acc-ink:#fff; --acc-soft:#f8dcd8;
  --ok:#22764a; --ok-soft:#dcefe2; --warn:#8f5a00; --warn-soft:#f7ebcc; --bad:#b3261e; --bad-soft:#f7d9d6;
  --tape:rgba(214,190,128,.6); --shadow:rgba(70,48,20,.14);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --desk:#121418; --paper:#1d2027; --card:#252932; --card-2:#2d323c;
  --ink:#efe9dc; --ink-2:#cbc5b6; --ink-3:#a39e91;
  --rule:rgba(255,140,120,.05); --line:#3a404b; --line-2:#545b67;
  --acc:#ff7a6b; --acc-ink:#1a0d0b; --acc-soft:#4a2723;
  --ok:#7fd4a0; --ok-soft:#203a2b; --warn:#e7b964; --warn-soft:#3d321b; --bad:#ff8d80; --bad-soft:#45231f;
  --tape:rgba(190,170,110,.3); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:500 15.5px/1.75 Mikhak,Tahoma,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.ltr{direction:ltr;text-align:left;unicode-bidi:plaintext}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
a{color:var(--acc)}
.book{max-width:860px;margin:0 auto;padding:0 12px 96px}
.mast{display:flex;align-items:center;gap:10px;padding:14px 4px 10px;position:sticky;top:0;z-index:5;background:var(--desk)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--acc)}
.brand .logo svg{width:30px;height:30px;display:block}
.mast-date{flex:1;color:var(--ink-2);font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--card-2)}
.sync-stamp{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 10px;font-size:12.5px;display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--ink-2)}
.sync-stamp.ok{color:var(--ok)}.sync-stamp.err{color:var(--bad)}.sync-stamp.offline{color:var(--warn)}
/* tabs: top strip on desktop, bottom bar on phones */
.tabs{display:flex;gap:6px;padding:6px 0 10px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px 10px 4px 4px;padding:7px 14px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
@media (max-width:700px){
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;box-shadow:0 -4px 18px var(--shadow)}
  .tab{flex:1;flex-direction:column;gap:0;border:0;background:transparent;padding:5px 2px;font-size:11.5px;border-radius:10px}
  .tab .ic{width:22px;height:22px}
  .tab.on{background:transparent;color:var(--acc)}
  .mast-date{font-size:12.5px}
}
/* paper sheet with a faint grid */
.sheet{background:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:22px 22px;border-radius:6px;padding:18px 16px 22px;box-shadow:0 2px 0 var(--line),0 10px 30px var(--shadow);min-height:70vh}
@media (max-width:700px){.sheet{padding:14px 10px 20px;border-radius:4px}}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.h-page{font-size:26px;font-weight:900;margin:0;line-height:1.3;display:inline-block;position:relative;padding:0 6px}
.h-page::after{content:"";position:absolute;inset:auto -2px 4px -2px;height:10px;background:var(--acc-soft);z-index:-1;border-radius:3px}
.page-head .sub{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;margin:14px 0;box-shadow:0 1px 0 var(--line);position:relative}
.card::before{content:"";position:absolute;top:-9px;right:22px;width:64px;height:18px;background:var(--tape);transform:rotate(-3deg);border-radius:2px;opacity:.8}
.h-sec{font-size:17px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.h-sec .ic{color:var(--acc)}
.h-sub{font-size:14px;font-weight:800;color:var(--ink-2);margin:10px 0 4px}
.muted{color:var(--ink-3);font-weight:500;font-size:13.5px}
.hint{color:var(--ink-3);font-size:13px;margin:6px 0}
.hint.center{text-align:center}
.note{font-size:13px;color:var(--ink-2);background:var(--card-2);border-radius:6px;padding:4px 8px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.btn{white-space:nowrap;border:1px solid var(--line-2);background:var(--card);border-radius:9px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--acc);cursor:pointer;font-weight:700;padding:6px 0;display:inline-flex;gap:5px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:20px;padding:4px 14px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chips.sm .chip{padding:1px 10px;font-size:12.5px}
/* exercise cards */
.ex{border-top:1px dashed var(--line-2);padding:12px 0 6px}
.ex:first-of-type{border-top:0}
.ex-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex h3{margin:0;font-size:16px;font-weight:800}
.slot{font-size:11.5px;font-weight:800;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:0 7px;white-space:nowrap}
.target{margin:2px 0;font-size:13px;color:var(--ink-2)}
.last{margin:2px 0;font-size:13px;color:var(--ink-3)}
.up{margin:4px 0;font-size:13px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:3px 8px;font-weight:700}
.ex.complete h3::after{content:" ✓";color:var(--ok)}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:520px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 1fr 44px;gap:6px;align-items:center}
.set-row .sn{font-weight:800;color:var(--ink-3);text-align:center}
.set-row .f{display:flex;flex-direction:column;align-items:stretch}
.set-row .f small{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.2}
.set-row input{width:100%;text-align:center;border:1px solid var(--line-2);border-radius:8px;padding:6px 2px;background:var(--paper);font-weight:800;font-size:16px;min-width:0}
.set-row input::placeholder{color:var(--ink-3);opacity:.55;font-weight:600}
.set-row.done input{background:var(--ok-soft);border-color:var(--ok)}
.tick{width:44px;height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink-3);align-self:start}
.set-row.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
/* meals */
.meals{list-style:none;padding:0;margin:8px 0}
.meal{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.meal:first-child{border-top:0}
.check{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--paper);cursor:pointer;display:grid;place-items:center;flex:none;color:#fff;margin-top:2px}
.done>.check,.meal.done .check{background:var(--ok);border-color:var(--ok)}
.meal-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.meal .time{color:var(--acc);font-weight:800;font-size:13.5px}
.kc{color:var(--ink-3);font-size:12.5px}
.meal .items{margin:2px 0;font-size:13px;color:var(--ink-2)}
.meal.done b{text-decoration:line-through;text-decoration-color:var(--ok)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:13px}
.track{height:10px;background:var(--card-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--acc);border-radius:6px}
/* tables + program rows */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:right;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line-2);padding:4px 6px}
.tbl td{border-bottom:1px dashed var(--line);padding:5px 6px}
.vol tr.st-ok td:last-child{color:var(--ok);font-weight:700}
.vol tr.st-low td:last-child,.vol tr.st-high td:last-child,.vol tr.lowf td:last-child{color:var(--bad);font-weight:700}
.vol tr.st-optional td{color:var(--ink-3)}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rows{display:flex;flex-direction:column}
.prow{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.prow:first-child{border-top:0}
.prow .slot{width:92px;text-align:center}
.prow b{display:block;font-size:14.5px}
.prow small{color:var(--ink-2);font-size:12.5px}
.tools{display:flex}
.tools .icon-btn{width:32px;height:32px}
.bad{color:var(--bad)}
.dots{margin:4px 0;padding-inline-start:20px}
.dots li{margin:3px 0}
/* nutrition */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.totals div{background:var(--card-2);border-radius:8px;padding:6px;text-align:center;display:flex;flex-direction:column}
.totals b{font-size:20px;font-weight:900;color:var(--acc)}
.totals span{font-size:12px;color:var(--ink-3)}
.checks{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.checks li{font-size:13.5px;padding:3px 8px;border-radius:6px;background:var(--card-2)}
.checks li.ok{background:var(--ok-soft);color:var(--ok)}
.checks li.warn{background:var(--warn-soft);color:var(--warn)}
.checks li.bad{background:var(--bad-soft);color:var(--bad)}
.opt{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.opt:first-of-type{border-top:0;margin-top:0}
.opt-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.food td:nth-child(3),.food td:nth-child(4){color:var(--ink-3);white-space:nowrap;width:1%}
/* shopping */
.shop{list-style:none;padding:0;margin:0}
.shop li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.shop li:first-child{border-top:0}
.shop li.done b{text-decoration:line-through;color:var(--ink-3)}
.shop small{color:var(--ink-3)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
/* body chart */
.chart{width:100%;height:auto;max-height:260px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.chart .grid{stroke:var(--line);stroke-dasharray:3 3}
.chart .avg{fill:none;stroke:var(--acc);stroke-width:2.2}
.chart .pt{fill:var(--card);stroke:var(--ink-2);stroke-width:1.4}
.chart .ax{font-size:9px;fill:var(--ink-3);text-anchor:end}
.chart .ax.s{text-anchor:start}
/* forms + dialogs */
label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2);font-weight:700;margin:6px 0}
input:not([type=file]),select,textarea{border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dlg{border:1px solid var(--line-2);border-radius:12px;background:var(--card);color:var(--ink);padding:16px;width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
.dlg::backdrop{background:rgba(20,15,10,.45)}
.dlg h2{margin:0 0 8px;font-size:18px}
.dlg .row{margin-top:12px;flex-wrap:wrap}
/* rest timer pill + toasts */
#pill{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30}
#pill button{--pct:0%;display:flex;align-items:center;gap:8px;border:0;border-radius:30px;padding:9px 16px;background:linear-gradient(90deg,var(--acc) var(--pct),#8f1f1a var(--pct));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 24px var(--shadow);max-width:92vw}
#pill b{font-size:20px;font-variant-numeric:tabular-nums}
#pill span{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
@media (min-width:701px){#pill{bottom:24px}}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:9px;font-size:14px;box-shadow:0 6px 18px var(--shadow);transition:opacity .35s;max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.toast.out{opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

  jy += 4 * idiv(days, 1461); days %= 1461;
  if (days > 365) { jy += idiv(days - 1, 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + idiv(days, 31) : 7 + idiv(days - 186, 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return { jy, jm, jd };
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------- IndexedDB ---------- */
let dbh = null;
function idb() {
  return new Promise((res, rej) => {
    if (dbh) return res(dbh);
    const r = indexedDB.open('homofit', 1);
    r.onupgradeneeded = e => { const d = e.target.result; ['kv', 'snaps'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
    r.onsuccess = e => { dbh = e.target.result; dbh.onversionchange = () => { dbh.close(); dbh = null; }; res(dbh); };
    r.onerror = () => rej(r.error);
  });
}
const txp = (store, mode, fn) => idb().then(db => new Promise((res, rej) => {
  const tx = db.transaction(store, mode); let out;
  const r = fn(tx.objectStore(store));
  if (r) r.onsuccess = () => { out = r.result; };
  tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
}));

  try {

      S.snapDay = today;
      const all = await txp('snaps', 'readonly', s => s.getAll());

      for (const o of old) await txp('snaps', 'readwrite', s => s.delete(o.id));

}

/* ========== Calculations: same rules as the coach skill's coach_calc.py ========== */
const exOf = k => EXERCISES[k] || D.customEx[k] || null;

const foodOf = k => FOODS[k] || D.customFoods[k] || null;

function itemMacros(it) {
  if (it.food) {
    const f = foodOf(it.food);
    if (!f) return { kcal: 0, p: 0, c: 0, f: 0, missing: true };
    const k = (Number(it.qty) || 0) / (f.unit === 'g' ? 100 : 1);
    return { kcal: f.kcal * k, p: f.p * k, c: f.c * k, f: f.f * k };
  }
  return { kcal: +it.kcal || 0, p: +it.p || 0, c: +it.c || 0, f: +it.f || 0, est: true };
}
function sumMacros(list) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  list.forEach(m => { t.kcal += m.kcal; t.p += m.p; t.c += m.c; t.f += m.f; });
  return t;
}
const optionTotals = opt => sumMacros((opt.items || []).map(itemMacros));
const mealOpt = (meal, optId) => (meal.options || []).find(o => o.id === optId) || (meal.options || [])[0];
/* the plan's day = the first option of every meal */
const planTotals = () => sumMacros(D.meals.list.map(m => { const o = mealOpt(m); return o ? optionTotals(o) : { kcal: 0, p: 0, c: 0, f: 0 }; }));
function latestWeight() { const b = D.body.filter(x => x.weight).sort((a, b) => a.date < b.date ? 1 : -1)[0]; return b ? b.weight : null; }
function nutritionCheck(t) {
  const tg = D.meals.targets, w = latestWeight(), out = [];
  const dk = (t.kcal - tg.kcal) / tg.kcal;
  out.push({ ok: Math.abs(dk) <= 0.05, text: `کالری ${fnum(t.kcal)} از هدف ${fnum(tg.kcal)}: ${fnum(Math.abs(dk * 100), 1)}٪ ${dk >= 0 ? 'بیشتر' : 'کمتر'}، مجاز تا ۵٪` });
  out.push({ ok: t.p >= 0.95 * tg.protein, text: `پروتئین ${fnum(t.p)} گرم از حداقل ${fnum(tg.protein)}` });
  if (w) {
    const fk = t.f / w, ck = t.c / w;
    out.push({ ok: fk >= 0.5 && fk <= 1.8, warn: fk > 1.5 && fk <= 1.8, text: `چربی ${fnum(fk, 1)} گرم به ازای هر کیلو (بازه‌ی علمی ۰.۵ تا ۱.۵)` });
    out.push({ ok: ck >= 3, text: `کربوهیدرات ${fnum(ck, 1)} گرم به ازای هر کیلو (حداقل ۳)` });

}

/* ---------- weekly volume ---------- */
function volume(prog) {
  prog = prog || D.program;
  const weekly = {}, freq = {}, days = [];
  Object.keys(MUSCLES).forEach(m => { weekly[m] = 0; freq[m] = 0; });
  prog.days.forEach(day => {
    const per = {}; let sets = 0; const direct = new Set();
    day.items.forEach(it => {
      const e = exOf(it.ex); const n = Number(it.sets) || 0; sets += n;
      if (!e) return;
      Object.entries(e.m).forEach(([m, w]) => { per[m] = (per[m] || 0) + w * n; if (w === 1) direct.add(m); });
    });
    Object.entries(per).forEach(([m, v]) => { if (weekly[m] !== undefined) weekly[m] += v; });
    direct.forEach(m => { if (freq[m] !== undefined) freq[m]++; });
    const over = Object.entries(per).filter(([, v]) => v > (prog.sessionCap || 10)).map(([m]) => m);
    days.push({ id: day.id, name: day.name, sets, minutes: sets * (prog.minPerSet || 2.5) + 10, over });
  });
  const rows = Object.keys(MUSCLES).map(m => {
    const v = weekly[m], opt = OPTIONAL.has(m);
    let st = v < prog.minSets ? (opt ? 'optional' : 'low') : v > prog.maxSets ? 'high' : 'ok';
    const lowFreq = !opt && freq[m] < 2 && v > 0;
    return { m, v, f: freq[m], st, lowFreq };
  });
  const push = PUSH.reduce((s, m) => s + weekly[m], 0), pull = PULL.reduce((s, m) => s + weekly[m], 0);
  return { rows, days, push, pull };
}

const repTop = r => { const n = toLatin(r).match(/\d+/g); return n ? +n[n.length - 1] : null; };
const setsFor = (date, itemId) => D.sets.filter(s => s.date === date && s.item === itemId).sort((a, b) => a.n - b.n);
function lastSession(exKey, beforeDate) {
  const rows = D.sets.filter(s => s.ex === exKey && s.date < beforeDate);
  if (!rows.length) return null;
  const date = rows.map(s => s.date).sort().pop();
  return { date, sets: rows.filter(s => s.date === date).sort((a, b) => a.n - b.n) };
}
/* double progression: all sets at the top of the range last time -> go up one step */
function progressHint(it, last) {
  if (!last) return '';
  const top = repTop(it.reps);
  if (!top || last.sets.length < (Number(it.sets) || 0)) return '';
  return last.sets.every(s => (s.reps || 0) >= top) ? 'دفعه‌ی قبل همه‌ی ست‌ها به سقف رسید؛ امروز وزنه رو یه پله سنگین‌تر کن.' : '';
}

/* ---------- body ---------- */
function weeklyAverages() {
  const m = new Map();
  D.body.filter(b => b.weight).forEach(b => { const k = weekStart(b.date); (m.get(k) || m.set(k, []).get(k)).push(b.weight); });
  return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([wk, ws]) => ({ wk, avg: ws.reduce((a, b) => a + b, 0) / ws.length, n: ws.length }));
}
function adherence(days) {
  const today = todayStr(); let done = 0, total = 0;
  for (let i = 1; i <= days; i++) { /* past days only: today's meals aren't missed yet */
    const d = shiftDay(today, -i);
    if (d < (D.meta.startDate || '0000')) break;
    total += D.meals.list.length;
    done += D.checks.filter(c => c.date === d).length;
  }
  return { done, total, pct: total ? done / total : 0 };
}

function nextCheckin() {
  const start = D.meta.startDate || todayStr(), every = D.settings.checkinEvery || 14;
  let d = shiftDay(start, every); const t = todayStr();
  while (d < t) d = shiftDay(d, every);
  return d;
}
function pageBody() {
  const W = weeklyAverages(), last = W[W.length - 1], prev = W[W.length - 2];
  let rate = '';
  if (last && prev) {
    const dw = last.avg - prev.avg, lo = last.avg * 0.0025, hi = last.avg * 0.005;
    const cls = dw < lo ? 'bad' : dw > hi ? 'warn' : 'ok';
    rate = `<li class="${cls}">${icon(cls === 'ok' ? 'check' : 'warn')} تغییر میانگین نسبت به هفته‌ی قبل: ${dw >= 0 ? '+' : '−'}${fnum(Math.abs(dw), 2)} کیلو (هدف ${fnum(lo, 2)} تا ${fnum(hi, 2)})${cls === 'bad' ? ' — اگه دو هفته این‌طوری بمونه، ۲۰۰ کالری اضافه کن.' : cls === 'warn' ? ' — تند داری بالا می‌ری؛ اگه دور کمر هم سریع زیاد شد، ۱۰۰ تا ۲۰۰ کالری کم کن.' : ''}</li>`;
  }
  const ad = adherence(14);
  const rows = D.body.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 30).map(b => `<tr><td>${jMid(b.date)}</td><td>${b.weight ? fnum(b.weight, 1) : '—'}</td><td>${b.waist ? fnum(b.waist, 1) : '—'}</td><td><button type="button" class="icon-btn" data-a="body.del" data-id="${b.id}" aria-label="حذف">${icon('trash')}</button></td></tr>`).join('');
  return head('بدن', 'هفته‌ای حداقل یه بار، همیشه یه روز و یه ساعت ثابت؛ ترجیحاً صبح ناشتا.') +
    `<section class="card"><h2 class="h-sec">${icon('plus')} ثبت تازه</h2>
      <label>روز<select id="bDate">${Array.from({ length: 14 }, (_, i) => { const d = shiftDay(todayStr(), -i); return `<option value="${d}">${i === 0 ? 'امروز، ' : i === 1 ? 'دیروز، ' : ''}${jLong(d)}</option>`; }).join('')}</select></label>
      <div class="grid2"><label>وزن (کیلو)<input id="bW" inputmode="decimal" placeholder="مثلاً ۶۰٫۴"></label><label>دور کمر (سانت)<input id="bWa" inputmode="decimal" placeholder="اختیاری"></label></div>
      <button type="button" class="btn pri" data-a="body.add">${icon('check')} ثبت</button></section>
    <section class="card"><h2 class="h-sec">${icon('chart')} روند</h2>${chart()}
      <ul class="checks">${last ? `<li>${icon('chart')} میانگین این هفته: ${fnum(last.avg, 1)} کیلو (${fa(last.n)} بار وزن‌کشی)</li>` : '<li>هنوز وزنی ثبت نشده.</li>'}${rate}
      <li>${icon('bowl')} پایبندی غذا تو ۱۴ روز اخیر: ${fnum(ad.pct * 100)}٪ (${fa(ad.done)} از ${fa(ad.total)} وعده)</li>
      <li>${icon('clock')} چک‌این بعدی: ${jLong(nextCheckin())}</li></ul>
      <button type="button" class="btn ghost" data-a="report">${icon('copy')} گزارش چک‌این برای Claude</button>
      <p class="hint">گزارش کپی می‌شه؛ تو چت با Claude بچسبونش.</p></section>
    <section class="card"><h2 class="h-sec">ثبت‌ها</h2>${rows ? `<table class="tbl"><thead><tr><th>تاریخ</th><th>وزن</th><th>کمر</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="hint">خالیه.</p>'}</section>`;
}
function chart() {
  const pts = D.body.filter(b => b.weight).sort((a, b) => a.date < b.date ? -1 : 1);
  if (pts.length < 2) return '<p class="hint">با دو بار وزن‌کشی نمودار ساخته می‌شه.</p>';
  const W = 320, H = 150, pad = 26, d0 = pts[0].date, span = Math.max(1, daysBetween(d0, pts[pts.length - 1].date));
  const ws = pts.map(p => p.weight), lo = Math.min(...ws) - .5, hi = Math.max(...ws) + .5;
  const x = d => pad + Math.min(1, Math.max(0, daysBetween(d0, d) / span)) * (W - pad - 8), y = v => H - 18 - (v - lo) / (hi - lo) * (H - 30);
  const avg = weeklyAverages().map(w => `${x(shiftDay(w.wk, 3) < d0 ? d0 : shiftDay(w.wk, 3)).toFixed(1)},${y(w.avg).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار وزن">
    <line x1="${pad}" y1="${y(lo + .5)}" x2="${W - 8}" y2="${y(lo + .5)}" class="grid"/><line x1="${pad}" y1="${y(hi - .5)}" x2="${W - 8}" y2="${y(hi - .5)}" class="grid"/>
    <text x="${pad - 4}" y="${y(lo + .5) + 4}" class="ax">${fnum(lo + .5, 1)}</text><text x="${pad - 4}" y="${y(hi - .5) + 4}" class="ax">${fnum(hi - .5, 1)}</text>
    <polyline points="${avg}" class="avg"/>${pts.map(p => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="3" class="pt"><title>${jShort(p.date)}: ${fnum(p.weight, 1)}</title></circle>`).join('')}
    <text x="${pad}" y="${H - 3}" class="ax s">${jShort(d0)}</text><text x="${W - 8}" y="${H - 3}" class="ax e">${jShort(pts[pts.length - 1].date)}</text></svg>
    <p class="hint">نقطه‌ها وزن‌کشی‌ها، خط میانگین هفته‌ها. به یه عدد تکی اعتماد نکن؛ آب و نمک جابه‌جاش می‌کنه.</p>`;
}

function checkinReport() {
  const t = todayStr(), from = shiftDay(t, -13), W = weeklyAverages().slice(-4), ad = adherence(14);
  const waist = D.body.filter(b => b.waist).sort((a, b) => a.date < b.date ? -1 : 1);
  const lines = [`# گزارش چک‌این هموفیت · ${jMid(t)}`, '', '## وزن و دور کمر'];
  lines.push(W.length ? W.map(w => `- هفته‌ی ${jShort(w.wk)}: میانگین ${fnum(w.avg, 2)} کیلو (${fa(w.n)} بار)`).join('\n') : '- وزنی ثبت نشده');
  if (waist.length) lines.push(`- دور کمر: ${waist.slice(-3).map(b => `${jShort(b.date)} ${fnum(b.waist, 1)}`).join('، ')}`);
  lines.push('', `## پایبندی غذا (۱۴ روز): ${fa(ad.done)} از ${fa(ad.total)} وعده (${fnum(ad.pct * 100)}٪)`);
  const skipped = {}; for (let i = 1; i <= 14; i++) { const d = shiftDay(t, -i); if (d < (D.meta.startDate || '0')) break; D.meals.list.forEach(m => { if (!D.checks.find(c => c.id === `${d}|${m.id}`)) skipped[m.name] = (skipped[m.name] || 0) + 1; }); }
  const sk = Object.entries(skipped).sort((a, b) => b[1] - a[1]).filter(x => x[1] > 0);
  if (sk.length) lines.push(`- بیشتر جاافتاده: ${sk.slice(0, 3).map(([n, c]) => `${n} (${fa(c)} بار)`).join('، ')}`);
  const recent = D.sets.filter(s => s.date >= from);
  lines.push('', `## تمرین (۱۴ روز): ${fa(new Set(recent.map(s => s.date)).size)} جلسه`);
  const byEx = {}; D.sets.forEach(s => { (byEx[s.ex] = byEx[s.ex] || []).push(s); });
  Object.entries(byEx).forEach(([k, rows]) => {
    const dates = [...new Set(rows.map(r => r.date))].sort();
    const top = d => rows.filter(r => r.date === d).sort((a, b) => (b.kg * (1 + b.reps / 30)) - (a.kg * (1 + a.reps / 30)))[0];
    const a = top(dates[0]), b = top(dates[dates.length - 1]);
    lines.push(`- ${exName(k)}: ${dates.length > 1 ? `${setStr(a)} (${jShort(a.date)}) ← ${setStr(b)} (${jShort(b.date)})` : `${setStr(b)} (${jShort(b.date)})`}`);
  });
  const pt = planTotals();
  lines.push('', '## برنامه‌ی فعلی', `- تمرین نسخه‌ی ${D.program.version}، غذا نسخه‌ی ${D.meals.version}`, `- هدف ${fnum(D.meals.targets.kcal)} کالری، برنامه ${fnum(pt.kcal)} کالری و ${fnum(pt.p)} گرم پروتئین`);
  lines.push('', '## یادداشت خودم', '- خواب: ', '- درد یا مشکل: ', '- چی سخت بود: ');
  return lines.join('\n');
}

    <label>رمز داده‌ها (اختیاری)<input id="syPass" type="password" autocomplete="new-password"></label>
    <p class="hint">با رمز، GitHub هم نمی‌تونه داده‌هات رو بخونه. روی همه‌ی دستگاه‌ها باید همین رمز رو بزنی؛ اگه یادت بره، داده‌ی ابری برنمی‌گرده.</p>
    <button type="button" class="btn pri" data-a="sync.connect">${icon('cloud')} وصل شو</button></section>`;
}
A['sync.connect'] = async el => {
  const repoPath = $('#syRepo').value, token = $('#syToken').value, pass = $('#syPass').value;
  if (!repoPath.trim() || !token.trim()) { toast('آدرس مخزن و کلید رو بنویس.', 'err'); return; }
  el.disabled = true; toast('دارم وصل می‌شم…');
  try { await syncConnect({ repoPath, token, pass }); }
  catch (e) { console.warn(e); toast(['input', 'public', 'needpass'].includes(e.kind) ? e.message : (SYNC_MSG[e.kind] || 'وصل نشد. آدرس مخزن و کلید رو چک کن.'), 'err', 7000); el.disabled = false; }
};
A['sync.now'] = async () => { await syncRun(); if (SYNC.state === 'ok') toast('همگام شد.'); else toast(SYNC.msg, 'err', 5000); };
A['sync.off'] = async () => { if (!await confirmBox('اتصال این دستگاه قطع بشه؟', 'داده‌ها پاک نمی‌شن. برای وصل شدن دوباره باید کلید رو دوباره بزنی.', 'قطع کن')) return; await syncDisconnect(); render(); toast('اتصال قطع شد.'); };

</script>
</body>
</html>
